version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: afterhours-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - audio_cache:/app/cache/audio
      - artwork_cache:/app/cache/artwork
      - telethon_sessions:/app/sessions
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - afterhours-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: afterhours-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - afterhours-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: afterhours-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - afterhours-net

volumes:
  audio_cache:
  artwork_cache:
  telethon_sessions:

networks:
  afterhours-net:
    driver: bridge
